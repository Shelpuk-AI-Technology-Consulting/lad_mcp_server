name: Startup smoke

# Proves the server actually starts and serves MCP for every documented client
# invocation. Runs on merge to main, where the slow distribution-building cases
# (uv run, uvx, docker) are affordable — the PR job runs everything except those.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        # Pinned rather than tracking latest: this installs and executes a remote
        # script, and an unpinned lint/build tool is exactly what broke CI before.
        run: |
          curl -LsSf https://astral.sh/uv/0.9.26/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show tooling
        run: |
          uvx --version
          docker info --format '{{.ServerVersion}}'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run startup smoke tests
        env:
          # Enables the `uvx --from git+https://...` case — the literal command every
          # documented client runs. It needs a pushed commit, so it only runs here.
          LAD_SMOKE_GIT_REF: ${{ github.sha }}
          LAD_SMOKE_GIT_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          python -m pytest tests/smoke -q -rs | tee smoke.log

      - name: Fail if any smoke case skipped
        # No smoke case may skip here. The distribution-building cases are the only
        # ones that can catch a packaging or dependency break, and a skip would leave
        # the job green while they never ran. Matching "^SKIPPED" rather than specific
        # reasons, so rewording a skip message cannot silently disable this guard.
        run: |
          if grep -q "^SKIPPED" smoke.log; then
            echo "::error::a smoke case skipped; every case must run on CI"
            grep "^SKIPPED" smoke.log
            exit 1
          fi
