name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check .

      - name: Run tests
        # `-m "not slow"` excludes the distribution-building smoke cases (uvx, docker):
        # this runner has Docker, so they would not skip, and a full image build would
        # add minutes to every PR. They run on merge to main via smoke.yml.
        # `-rs` surfaces skip reasons, so a permanently-skipped case cannot hide.
        run: python -m pytest tests/ -q -m "not slow" -rs
