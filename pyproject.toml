[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lad-mcp-server"
version = "0.4.4"
description = "MCP server providing system design review and code review via OpenRouter with optional Serena context."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
  # Upper bound is load-bearing, not caution: mcp 2.0.0 removed `mcp.server.fastmcp`,
  # which `server.py` imports. Without it a fresh install resolves to 2.x and the
  # server cannot start at all — while the unit suite stays green, because nothing
  # in `tests/` imports the SDK. See tests/smoke/ for the check that catches this.
  "mcp[cli]>=1.2.0,<2",
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  # Property-based tests for the data-egress security boundaries. Bounded below 7
  # because a major release may change strategy semantics, and these properties are
  # a merge gate.
  "hypothesis>=6.100,<7",
  # Upper bound so a ruff release cannot change CI's verdict on unchanged code.
  # See the [tool.ruff.lint] note below.
  "ruff>=0.5.0,<0.17.0",
]

[project.scripts]
lad-mcp-server = "lad_mcp_server.__main__:main"

[tool.pytest.ini_options]
# --strict-markers so a typo'd `@pytest.mark.slwo` errors instead of quietly moving a
# distribution-building case into the PR job, where it would add minutes to every run.
addopts = "--strict-markers"
markers = [
  "slow: builds or installs a distribution (uv run, uvx, docker). Excluded from the PR job; run on merge to main.",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# State the rule set explicitly rather than inheriting ruff's default.
#
# `ruff` is unpinned at the lower bound and CI installs the newest match at run
# time, so an implicit rule set makes the build's verdict depend on the release
# date. Ruff 0.16.0 (2026-07-23) grew its default selection from 59 rules to 413,
# which turned an unchanged tree from 3 findings into 136 and broke CI on `main`
# without a single line of source changing.
#
# These four are ruff's pre-0.16 default, and therefore the set every green build
# in this repository was actually checked against. Adopting the wider 0.16 default
# is a reasonable thing to want, but it is a deliberate decision with ~130 findings
# behind it, not something a dependency resolution should make on our behalf.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lad_mcp_server*"]
exclude = ["research*", "tests*", "scripts*"]
